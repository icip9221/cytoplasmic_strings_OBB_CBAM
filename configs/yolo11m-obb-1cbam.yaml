# Ultralytics YOLO 🚀, AGPL-3.0 license
# Fixed: CBAM placed AFTER downsample Conv to match dimensions

# Parameters
nc: 1
scales:
  m: [0.50, 1.00, 512]


# YOLO11m backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11m head with CBAM applied to the P5 feature
head:
  - [-1, 1, CBAM, [512]] # 11 P5 attention

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]]                  # 13
  - [-1, 2, C3k2, [512, False]]                # 14 P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]]                  # 16
  - [-1, 2, C3k2, [256, False]]                # 17 P3/8

  - [-1, 1, Conv, [256, 3, 2]]                 # 18
  - [[-1, 14], 1, Concat, [1]]                 # 19
  - [-1, 2, C3k2, [512, False]]                # 20 P4/16

  - [-1, 1, Conv, [512, 3, 2]]                 # 21
  - [[-1, 11], 1, Concat, [1]]                 # 22, 
  - [-1, 2, C3k2, [1024, True]]                # 23 P5/32

  - [[17, 20, 23], 1, OBB, [nc, 1]]            # 24 Detect

