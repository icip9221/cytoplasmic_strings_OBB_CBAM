# Parameters
nc: 1
scales:
  # [depth, width, max_channels]
  m: [0.50, 1.00, 512]


# YOLO12m backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# YOLO12m head with CBAM applied to the P5 feature
head:
  - [-1, 1, CBAM, [512]] # 9 P5 attention

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]]                  # 11
  - [-1, 2, A2C2f, [512, False, -1]]           # 12 P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]]                  # 14
  - [-1, 2, A2C2f, [256, False, -1]]           # 15 P3/8

  - [-1, 1, Conv, [256, 3, 2]]                 # 16
  - [[-1, 12], 1, Concat, [1]]                 # 17
  - [-1, 2, A2C2f, [512, False, -1]]           # 18 P4/16

  - [-1, 1, Conv, [512, 3, 2]]                 # 19
  - [[-1, 9], 1, Concat, [1]]                  # 20
  - [-1, 2, C3k2, [1024, True]]                # 21 P5/32

  - [[15, 18, 21], 1, OBB, [nc, 1]]            # 22 Detect
