# Parameters
nc: 1

scales:
  # [depth, width, max_channels]
  m: [0.50, 1.00, 512]

# YOLO11m backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2
  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                 # 6
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 8
  - [-1, 1, SPPF, [1024, 5]]                   # 9
  - [-1, 2, C2PSA, [1024]]                     # 10

# YOLO11m HBB head with CBAM applied to the P5 feature
head:
  - [-1, 1, CBAM, [512]]                       # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]]                  # 13
  - [-1, 2, C3k2, [512, False]]                # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]]                  # 16
  - [-1, 2, C3k2, [256, False]]                # 17

  - [-1, 1, Conv, [256, 3, 2]]                 # 18
  - [[-1, 13], 1, Concat, [1]]                 # 19 legacy index
  - [-1, 2, C3k2, [512, False]]                # 20

  - [-1, 1, Conv, [512, 3, 2]]                 # 21
  - [[-1, 10], 1, Concat, [1]]                 # 22 legacy index
  - [-1, 2, C3k2, [1024, True]]                # 23

  - [[16, 19, 22], 1, Detect, [nc]]            # 24 legacy indices